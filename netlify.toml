[build]
  publish = "dist"
  command = "npm run build"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    Permissions-Policy = "camera=(self *), microphone=(self *), display-capture=*"
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"
    Access-Control-Allow-Origin = "*"
